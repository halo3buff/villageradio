name: deploy
on:
  push:
    # `main` is the production trigger (active after Phase 8 cutover).
    # `gcp-migration` lets us validate CD before cutover without touching main.
    # (GitHub only allows workflow_dispatch for workflows on the default branch,
    #  so a push trigger on the feature branch is the working pre-cutover test.)
    branches: [main, gcp-migration]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write          # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true        # materialize the real interlude MP3s into the build context

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_SERVICE }}" \
            --source . \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --set-env-vars "TRANSMISSIONS_BUCKET=${{ vars.GCP_TRANSMISSIONS_BUCKET }},CONFIG_BUCKET=${{ vars.GCP_CONFIG_BUCKET }}" \
            --set-secrets "ADMIN_USERNAME=ADMIN_USERNAME:latest,ADMIN_PASSWORD_HASH=ADMIN_PASSWORD_HASH:latest,SESSION_SECRET=SESSION_SECRET:latest" \
            --allow-unauthenticated \
            --min-instances 1 --max-instances 4 \
            --cpu 1 --memory 512Mi \
            --quiet
